name: CI/CD Pipeline

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

on:
  push:
    branches: [ main ]

jobs:
  test-build-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: |
          npm ci
          npm install -g vercel
      
      - name: Check coverage threshold
        run: |
          echo "Checking minimum coverage of 80% in the dough src/hooks..."
          npm run test:coverage:check
      
      - name: Create .env file
        run: |
          echo "VITE_CURRENCYAPI_KEY=${{ secrets.VITE_CURRENCYAPI_KEY }}" >> .env
          echo "VITE_CURRENCYAPI_BASE_URL=${{ secrets.VITE_CURRENCYAPI_BASE_URL }}" >> .env
      
      - name: Build application
        run: npm run build

      - name: Deploy to Vercel (CLI)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          VERCEL_ORG_ID="${{ secrets.VERCEL_ORG_ID }}" VERCEL_PROJECT_ID="${{ secrets.VERCEL_PROJECT_ID }}" vercel deploy dist --prod --token="${{ secrets.VERCEL_TOKEN }}"

